        function render() {
            const search = document.getElementById("searchInput").value.toLowerCase();
            const timeline = document.getElementById("timelineFilter").value;
            const container = document.getElementById("content");
            container.innerHTML = "";

            data.forEach(section => {
                let sectionHTML = `<div class="big-idea"><h2>${section.bigIdea}</h2>`;
                let hasVisibleThemes = false;

                section.themes.forEach(theme => {
                    if (timeline === "all" || theme.period === timeline) {
                        const themeMatch = theme.name.toLowerCase().includes(search);
                        const matchingLinks = theme.links.filter(link => 
                            link[0].toLowerCase().includes(search)
                        );
                        const matchingAcademic = theme.academic ? theme.academic.filter(link => 
                            link[0].toLowerCase().includes(search)
                        ) : [];
                        const matchingArtists = theme.artists ? theme.artists.filter(link => 
                            link[0].toLowerCase().includes(search)
                        ) : [];

                        if (search === "" || themeMatch || matchingLinks.length > 0 || 
                            matchingAcademic.length > 0 || matchingArtists.length > 0) {
                            hasVisibleThemes = true;
                            
                            const periodLabel = {
                                'ancient': 'Ancient / Pre-1500',
                                'industrial': 'Industrial (1500–1950)',
                                'digital': 'Digital (1950–2000)',
                                'contemporary': 'Contemporary (2000–Now)'
                            };
                            
                            sectionHTML += `<div class="theme">
                                <h3>${theme.name}<span class="period-badge">${periodLabel[theme.period]}</span></h3>`;

                            // Wikipedia/Reference Links
                            if (matchingLinks.length > 0 || search === "") {
                                sectionHTML += `<div class="section-title">Reference Links:</div><div class="links">`;
                                (matchingLinks.length > 0 ? matchingLinks : theme.links).forEach(link => {
                                    sectionHTML += `<a href="${link[1]}" target="_blank">${link[0]}</a>`;
                                });
                                sectionHTML += `</div>`;
                            }

                            // Academic Resources
                            if (theme.academic && (matchingAcademic.length > 0 || search === "")) {
                                sectionHTML += `<div class="section-title">Academic Resources:</div><div class="links">`;
                                (matchingAcademic.length > 0 ? matchingAcademic : theme.academic).forEach(link => {
                                    sectionHTML += `<a href="${link[1]}" target="_blank">${link[0]}</a>`;
                                });
                                sectionHTML += `</div>`;
                            }

                            // Artist Works
                            if (theme.artists && (matchingArtists.length > 0 || search === "")) {
                                sectionHTML += `<div class="section-title">Artist Works & Exhibitions:</div><div class="links">`;
                                (matchingArtists.length > 0 ? matchingArtists : theme.artists).forEach(link => {
                                    sectionHTML += `<a href="${link[1]}" target="_blank">${link[0]}</a>`;
                                });
                                sectionHTML += `</div>`;
                            }

                            sectionHTML += `</div>`;
                        }
                    }
                });

                if (hasVisibleThemes) {
                    sectionHTML += `</div>`;
                    container.innerHTML += sectionHTML;
                }
            });
        }

        document.getElementById("searchInput").addEventListener("input", render);
        document.getElementById("timelineFilter").addEventListener("change", render);
        render();
    </script>
