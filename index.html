    function renderPeerGroups(entries, search) {
        const groups = { yes: [], possible: [], no: [] };
        entries.forEach(e => {
            const status = e[2] || "no";
            if (search === "" || e[0].toLowerCase().includes(search)) {
                groups[status].push(e);
            }
        });

        const labels = {
            yes: "✅ Peer-Reviewed",
            possible: "🔶 Possibly Peer-Reviewed",
            no: "📰 Not Peer-Reviewed"
        };

        let html = "";
        ["yes", "possible", "no"].forEach(status => {
            if (groups[status].length > 0) {
                html += `<div class="peer-label ${status}">${labels[status]}</div>`;
                html += `<div class="peer-group ${status} links">`;
                groups[status].forEach(e => {
                    if (e[1] === "#no-link") {
                        html += `<span class="no-link-entry">${e[0]} <em>(link not yet available)</em></span>`;
                    } else {
                        html += `<a href="${e[1]}" target="_blank">${e[0]}</a>`;
                    }
                });
                html += `</div>`;
            }
        });
        return html;
    }

    function render() {
        const search = document.getElementById("searchInput").value.toLowerCase();
        const timeline = document.getElementById("timelineFilter").value;
        const container = document.getElementById("content");
        container.innerHTML = "";

        data.forEach(section => {
            let sectionHTML = `<div class="big-idea"><h2>${section.bigIdea}</h2>`;
            let hasVisibleThemes = false;

            section.themes.forEach(theme => {
                if (timeline === "all" || theme.period === timeline) {
                    const themeMatch = theme.name.toLowerCase().includes(search);
                    const matchingLinks = theme.links ? theme.links.filter(l => l[0].toLowerCase().includes(search)) : [];
                    const matchingAcademic = theme.academic ? theme.academic.filter(l => l[0].toLowerCase().includes(search)) : [];
                    const matchingArtists = theme.artists ? theme.artists.filter(l => l[0].toLowerCase().includes(search)) : [];

                    if (search === "" || themeMatch || matchingLinks.length > 0 || matchingAcademic.length > 0 || matchingArtists.length > 0) {
                        hasVisibleThemes = true;

                        const periodLabel = {
                            'ancient': 'Ancient / Pre-1500',
                            'industrial': 'Industrial (1500–1950)',
                            'digital': 'Digital (1950–2000)',
                            'contemporary': 'Contemporary (2000–Now)'
                        };

                        sectionHTML += `<div class="theme">
                            <h3>${theme.name}<span class="period-badge">${periodLabel[theme.period]}</span></h3>`;

                        // Reference Links
                        const linksToShow = search === "" ? (theme.links || []) : matchingLinks;
                        if (linksToShow.length > 0) {
                            sectionHTML += `<div class="section-title">Reference Links:</div><div class="links">`;
                            linksToShow.forEach(l => {
                                sectionHTML += `<a href="${l[1]}" target="_blank">${l[0]}</a>`;
                            });
                            sectionHTML += `</div>`;
                        }

                        // Academic Resources split by peer review
                        const academicToShow = search === "" ? (theme.academic || []) : matchingAcademic;
                        if (academicToShow.length > 0) {
                            sectionHTML += `<div class="section-title">Academic & Media Resources:</div>`;
                            sectionHTML += renderPeerGroups(academicToShow, "");
                        }

                        // Artist Works
                        const artistsToShow = search === "" ? (theme.artists || []) : matchingArtists;
                        if (artistsToShow.length > 0) {
                            sectionHTML += `<div class="section-title">Artist Works & Exhibitions:</div><div class="links">`;
                            artistsToShow.forEach(l => {
                                sectionHTML += `<a href="${l[1]}" target="_blank">${l[0]}</a>`;
                            });
                            sectionHTML += `</div>`;
                        }

                        sectionHTML += `</div>`;
                    }
                }
            });

            if (hasVisibleThemes) {
                sectionHTML += `</div>`;
                container.innerHTML += sectionHTML;
            }
        });
    }

    document.getElementById("searchInput").addEventListener("input", render);
    document.getElementById("timelineFilter").addEventListener("change", render);
    render();
    </script>
</body>
</html>
